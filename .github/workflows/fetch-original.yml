name: Fetch original site files
on:
  push:
    paths: ['.github/workflows/fetch-original.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files from the live Vercel site
        run: |
          mkdir -p original
          for f in index.html services.html area.html reviews.html about.html contact.html card.html leave-review.html style.css site.webmanifest robots.txt sitemap.xml favicon.png icon-180.png icon-192.png icon-512.png home-approved-v9.png dfw-service-area.png business-card-mobile.png mowermobile-logo-option1.png; do
            curl -fsSL "https://mowermobile.vercel.app/$f" -o "original/$f" || echo "missing $f"
          done
          curl -fsSL "https://mowermobile.vercel.app/api/reviews" -o original/reviews-api-snapshot.json || true
          ls -la original
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add original
          git commit -m "Snapshot of the live mowermobile.vercel.app files" || echo "nothing to commit"
          git push
